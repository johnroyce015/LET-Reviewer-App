<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - LET Reviewer</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/users.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body>

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 2px 2px 0px #111827;">📖</div>
                <span style="font-weight: 900; font-size: 22px; color: #111827; letter-spacing: -0.5px;">LETReviewer</span>
            </div>

            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item active"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>
        <a href="#" id="logoutBtn" class="menu-item" style="color: #EF4444; font-weight: 700;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="questions-page" style="padding: 0;">
            
            <div class="questions-header">
                <div>
                    <h1 class="questions-title">Users</h1>
                    <p class="questions-subtitle">Manage LET Reviewer student accounts and teacher access.</p>
                </div>
                <button class="add-question-btn" id="openAddUserBtn">
                    <i class="fa-solid fa-user-plus"></i> Add User
                </button>
            </div>

            <div class="question-table-header" style="grid-template-columns: 2fr 1fr 1fr 1fr;">
                <div>User Email</div>
                <div>Role</div>
                <div>Status</div>
                <div>Actions</div>
            </div>

            <div id="usersContainer">
                <div style="padding: 20px; text-align: center;">Loading users...</div>
            </div>

        </div>
    </main>
</div>

<div id="addUserModal" class="modal-overlay" style="display: none;">
    <div class="modal-content neo-brutal-modal">
        <div class="modal-header" style="background: #C4B5FD;">
            <h3><i class="fa-solid fa-user-plus"></i> Create New Account</h3>
            <button class="close-modal-btn" id="closeAddUserBtn">&times;</button>
        </div>
        <form id="addUserForm">
            <div class="modal-body" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Email Address</label>
                    <input type="email" id="newEmail" required style="width: 100%; padding: 10px; border: 2px solid #111827; border-radius: 6px; font-family: inherit;">
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Password (Min 6 characters)</label>
                    <input type="password" id="newPassword" required minlength="6" style="width: 100%; padding: 10px; border: 2px solid #111827; border-radius: 6px; font-family: inherit;">
                </div>
                <div>
                    <label style="font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;">Account Role</label>
                    <select id="newRole" style="width: 100%; padding: 10px; border: 2px solid #111827; border-radius: 6px; font-family: inherit; font-weight: bold;">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher (Admin)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="neo-button" id="cancelAddUserBtn" style="background: #E5E7EB; color: #111827; width: auto; padding: 10px 20px;">Cancel</button>
                <button type="submit" class="neo-button" style="background: #10B981; color: #FFFFFF; width: auto; padding: 10px 20px;">Create Account</button>
            </div>
        </form>
    </div>
</div>

<div id="logoutModal" class="modal-overlay" style="display: none;">
    <div class="modal-content neo-brutal-modal">
        <div class="modal-header" style="background: #FDE68A;">
            <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
        </div>
        <div class="modal-body">
            <p>Are you sure you want to log out of the admin panel?</p>
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px;">
            <button class="neo-button" id="cancelLogoutBtn" style="background: #E5E7EB; color: #111827; width: auto; padding: 10px 20px;">Cancel</button>
            <button class="neo-button" id="confirmLogoutBtn" style="background: #EF4444; color: #FFFFFF; width: auto; padding: 10px 20px;">Log Out</button>
        </div>
    </div>
</div>

</body>
</html>

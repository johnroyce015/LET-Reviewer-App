<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Exam - LET Reviewer</title>
    
    <link rel="manifest" href="../manifest.json">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/student/pages/quiz.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <script src="../assets/js/supabase.js" defer></script>
    <script src="../assets/js/admin/modals.js" defer></script> 
    <script src="../assets/js/offline-sync.js" defer></script>
    <script src="../assets/js/student/quiz.js" defer></script>
</head>
<body style="background-color: #F8FAFC;">

    <nav class="quiz-nav">
        <div class="nav-left">
            <button class="btn-quit" id="quitQuizBtn"><i class="fa-solid fa-xmark"></i> Quit Exam</button>
            <span id="quizCategoryLabel" class="quiz-badge">Loading Subject...</span>
        </div>
        <div class="nav-right">
            <div class="timer-badge" id="timerDisplay">
                <i class="fa-solid fa-clock"></i> 00:00
            </div>
        </div>
    </nav>

    <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <main class="quiz-container">
        <div class="neo-card quiz-card">
            
            <div class="question-header">
                <span class="question-number" id="questionCounter">Question 1 of ?</span>
            </div>

            <h2 class="question-text" id="questionText">Loading question...</h2>

            <div class="options-grid" id="optionsContainer">
                </div>

            <div class="quiz-actions">
                <button class="neo-button" id="prevBtn" style="background: #E5E7EB; display: none;">
                    <i class="fa-solid fa-arrow-left"></i> Previous
                </button>
                <button class="neo-button btn-next" id="nextBtn" style="background: #111827; color: white;">
                    Next <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
            
        </div>
    </main>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('../sw.js')
                .then(reg => console.log('✅ SW Registered on this page'))
                .catch(err => console.error('❌ SW Failed', err));
        });
    }
</script>
</body>
</html>

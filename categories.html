<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - LET Reviewer</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="assets/js/supabase.js?v=999" defer></script>
    <script src="assets/js/categories.js?v=999" defer></script>
    <script src="assets/js/modals.js?v=999" defer></script>
    <script src="assets/js/logout.js?v=999" defer></script>
</head>
<body>

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 2px 2px 0px #111827;">📖</div>
                <span style="font-weight: 900; font-size: 22px; color: #111827; letter-spacing: -0.5px;">LETReviewer</span>
            </div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item active"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>
        <a href="#" id="logoutBtn" class="menu-item" style="color: #EF4444; font-weight: 700;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="neo-header" style="margin-bottom: 30px;">
            <div class="neo-icon" style="background: #C4B5FD;"><i class="fa-solid fa-layer-group"></i></div>
            <div class="neo-header-text">
                <h1 style="font-size: 28px; margin-bottom: 5px;">Categories</h1>
                <p style="margin: 0;">Manage your subject areas and upload new question banks.</p>
            </div>
        </div>

        <div id="categoryContainer" class="categories-grid">
            <h2 style="grid-column: 1 / -1; text-align: center; margin-top: 50px;">Loading categories...</h2>
        </div>
    </main>

</div>

<template id="categoryCardTemplate">
        <div class="category-card">
            <div class="category-top">
                <div class="category-status"><div class="status-dot"></div> Active</div>
                <div class="category-card-actions">
                    <button class="category-action-btn" title="Delete Category">
                        <i class="fa-solid fa-trash" style="color: #EF4444;"></i>
                    </button>
                </div>
            </div>
            <h2 class="category-name"></h2>
            <div class="category-code"></div>
            <p class="category-description"></p>
            <div class="category-footer">
                <span class="category-items">Status: Live</span>
                <span class="view-details" style="cursor: pointer;">Manage <i class="fa-solid fa-arrow-right"></i></span>
            </div>
        </div>
    </template>

    <template id="addCategoryTemplate">
        <div class="add-category-card">
            <div class="add-icon"><i class="fa-solid fa-plus"></i></div>
            <h3>Add Data</h3>
            <p>Upload a new CSV to populate categories.</p>
        </div>
    </template>

</body>
</html>

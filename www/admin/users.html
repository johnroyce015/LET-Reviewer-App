<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - LET Reviewer</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
    <script src="../assets/js/admin/modals.js" defer></script>
    <script src="../assets/js/admin/users.js" defer></script>
    <script src="../assets/js/logout.js" defer></script>
</head>
<body style="visibility: hidden;">

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div class="logo-icon">📖</div>
                <span class="logo-text">LETReviewer</span>
            </div>

            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item active"><i class="fa-solid fa-users"></i> Users</a>
                <a href="activity.html" class="menu-item"><i class="fa-solid fa-clipboard-list"></i> Activity Log</a>
                <a href="scores.html" class="menu-item"><i class="fa-solid fa-chart-simple"></i> Scores</a>
            </nav>
        </div>
        <a href="#" id="logoutBtn" class="menu-item btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="questions-page">
            
            <div class="questions-header">
                <div>
                    <h1 class="questions-title">Users</h1>
                    <p class="questions-subtitle">Manage LET Reviewer student accounts and teacher access.</p>
                </div>
                <button class="add-question-btn" id="openAddUserBtn">
                    <i class="fa-solid fa-user-plus"></i> Add User
                </button>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchUserInput" class="search-input" placeholder="Search by name, email, or course...">
                </div>
                <select id="courseFilter" class="filter-select">
                    <option value="All">All Courses</option>
                </select>
            </div>

            <div class="user-table-grid">
                <div>Name</div>
                <div>User Email</div>
                <div>Role</div>
                <div>Status</div>
                <div>Actions</div>
            </div>

            <div id="usersContainer">
                <div class="loading-state">Loading users...</div>
            </div>

        </div>
    </main>
</div>

<div id="addUserModal" class="modal-overlay hidden">
    <div class="modal-content neo-brutal-modal">
        <div class="modal-header purple">
            <h3><i class="fa-solid fa-user-plus"></i> Create New Account</h3>
        </div>
        <form id="addUserForm">
            <div class="modal-body form-stack">
                <div class="neo-form-group">
                    <label class="neo-label">Full Name</label>
                    <input type="text" id="newName" class="neo-input" required>
                </div>
                <div class="neo-form-group">
                    <label class="neo-label">Email Address</label>
                    <input type="email" id="newEmail" class="neo-input" required>
                </div>
                <div class="neo-form-group">
                    <label class="neo-label">Password</label>
                    <input type="password" id="newPassword" class="neo-input" required minlength="6">
                </div>
                <div class="neo-form-group">
                    <label class="neo-label">Course / Major</label>
                    <input type="text" id="newCourse" class="neo-input" placeholder="e.g., BEEd or BSEd-English">
                </div>
                <div class="neo-form-group">
                    <label class="neo-label">Account Role</label>
                    <select id="newRole" class="neo-input">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer modal-footer-actions">
                <button type="button" class="neo-button btn-cancel" id="cancelAddUserBtn">Cancel</button>
                <button type="submit" class="neo-button btn-confirm">Create Account</button>
            </div>
        </form>
    </div>
</div>

<div id="editUserModal" class="modal-overlay hidden">
    <div class="modal-content neo-brutal-modal">
        <div class="modal-header purple">
            <h3><i class="fa-solid fa-pen"></i> Edit User</h3>
        </div>
        <form id="editUserForm">
            <input type="hidden" id="editUserId">
            <div class="modal-body form-stack">
                <div class="neo-form-group">
                    <label class="neo-label">Full Name</label>
                    <input type="text" id="editName" class="neo-input" required>
                </div>
                <div class="neo-form-group">
                    <label class="neo-label">Course / Major</label>
                    <input type="text" id="editCourse" class="neo-input" placeholder="e.g., BEEd or BSEd-English">
                </div>
                <div class="neo-form-group">
                    <label class="neo-label">Account Role</label>
                    <select id="editRole" class="neo-input">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer modal-footer-actions">
                <button type="button" class="neo-button btn-cancel" id="cancelEditUserBtn">Cancel</button>
                <button type="submit" class="neo-button btn-confirm">Save Changes</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>

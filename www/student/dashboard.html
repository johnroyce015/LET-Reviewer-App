<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home - LET Reviewer</title>
    
    <link rel="manifest" href="/manifest.json">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
    <script src="../assets/js/admin/modals.js" defer></script>
    <script src="../assets/js/offline-sync.js" defer></script>
    <script src="../assets/js/student/dashboard.js" defer></script>
    <script src="../assets/js/student/navigation.js" defer></script>
</head>
<body class="bg-slate hidden-body">

<div class="mobile-app-container">

    <header class="app-topbar">
        <div class="user-avatar clickable" id="openProfileSidebar" title="Profile Menu">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="brand-name">LETReviewer</div>
        <div class="notification-bell">
            <i class="fa-regular fa-bell"></i>
        </div>
    </header>

    <main class="app-content">
        <div class="welcome-section">
            <div>
                <p class="welcome-greeting">Hello, <span id="studentFirstName">Student</span></p>
                <h2 class="welcome-title">Ready to crush your LET<br>goals today?</h2>
            </div>
        </div>

        <div class="neo-card mobile-card purple-card resume-card">
            <div class="resume-header">
                <i class="fa-regular fa-circle-play"></i>
                <span class="resume-label">Resume Quiz</span>
            </div>
            <h3 class="resume-title">Professional Education Mock Exam</h3>
            <p class="resume-meta">Question 14 of 50 • 25 mins left</p>
            <button class="neo-button btn-small btn-resume">
                Continue Quiz <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>

        <div class="neo-card mobile-card white-card readiness-card">
            <h3 class="readiness-title">Overall Readiness</h3>
            <p class="readiness-desc">You're on track! Keep pushing forward.</p>
            
            <div class="readiness-score-container">
                <div class="readiness-score">78%</div>
                <div class="status-pill">Good Standing</div>
            </div>
            
            <div class="readiness-stats">
                <span>Progress</span>
                <span>78/100</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" style="width: 78%; background: #6EE7B7;"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">Subject Areas</h3>
            <a href="#" style="font-size: 14px; font-weight: bold; color: #6B7280; text-decoration: none;">View All ></a>
        </div>

        <div id="quizContainer" class="subject-stack">
            <div class="state-loading">Fetching your review modules...</div>
        </div>

        </div>
    </main>

</div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('✅ SW Registered on this page'))
                .catch(err => console.error('❌ SW Failed', err));
        });
    }
</script>
</body>
</html>

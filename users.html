<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - LET Reviewer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js" defer></script>
    <script src="assets/js/users.js" defer></script>
    <script src="assets/js/modals.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body>

<div class="dashboard-layout">
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
    <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 2px 2px 0px #111827;">📖</div>
    <span style="font-weight: 900; font-size: 22px; color: #111827; letter-spacing: -0.5px;">LETReviewer</span>
</div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item active"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>
        <a href="#" id="logoutBtn" class="menu-item btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="questions-page">
            <div class="questions-header">
                <div>
                    <h1 class="questions-title">Users</h1>
                    <p class="questions-subtitle">Manage LET Reviewer student accounts and teacher access.</p>
                </div>
                <button class="add-question-btn" id="openAddUserBtn">
                    <i class="fa-solid fa-user-plus"></i> Add User
                </button>
            </div>

            <div class="question-table-header user-table-grid">
                <div>User Email</div>
                <div>Role</div>
                <div>Status</div>
                <div>Actions</div>
            </div>

            <div id="usersContainer">
                <div class="loading-state">Loading users...</div>
            </div>
        </div>
    </main>
</div>

<template id="userRowTemplate">
    <div class="user-row">
        <div>
            <span class="user-email-text"></span>
            <span class="user-you-badge hidden">(You)</span>
        </div>
        <div>
            <span class="role-badge"></span>
        </div>
        <div>
            <span class="status-text">
                <i class="status-icon fa-solid"></i> <span class="status-label"></span>
            </span>
        </div>
        <div class="action-cell">
            <button class="delete-user-btn"><i class="fa-solid fa-trash"></i></button>
        </div>
    </div>
</template>

<div id="addUserModal" class="modal-overlay hidden">
    <div class="modal-content neo-brutal-modal">
        <div class="modal-header purple">
            <h3><i class="fa-solid fa-user-plus"></i> Create New Account</h3>
            <button class="close-modal-btn" id="closeAddUserBtn">&times;</button>
        </div>
        <form id="addUserForm">
            <div class="modal-body form-stack">
                <div>
                    <label class="form-label">Email Address</label>
                    <input type="email" id="newEmail" class="form-input" required>
                </div>
                <div>
                    <label class="form-label">Password (Min 6 chars)</label>
                    <input type="password" id="newPassword" class="form-input" required minlength="6">
                </div>
                <div>
                    <label class="form-label">Account Role</label>
                    <select id="newRole" class="form-input">
                        <option value="student">Student</option>
                        <option value="teacher">Teacher (Admin)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer modal-footer-actions">
                <button type="button" class="btn-cancel" id="cancelAddUserBtn">Cancel</button>
                <button type="submit" class="btn-confirm">Create Account</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>

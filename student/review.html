<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review - LET Reviewer</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
    <script src="../assets/js/student/review.js" defer></script>
    <script src="../assets/js/student/navigation.js" defer></script>
</head>
<body class="bg-slate hidden-body">
<div class="mobile-app-container">
    
    <header class="app-topbar">
        <div class="user-avatar clickable" id="openProfileSidebar" title="Profile Menu">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="brand-name">LETReviewer</div>
        <div class="notification-bell"><i class="fa-regular fa-bell"></i></div>
    </header>

    <main class="app-content">
        <div class="review-header">
            <h1 class="review-title">Review Modules<br>Library</h1>
            <p class="review-desc">Master your concepts with targeted practice.</p>
        </div>

        <div id="reviewModulesContainer" class="subject-stack">
            <div class="state-loading">Loading modules...</div>
        </div>
    </main>
</div>
</body>
</html>

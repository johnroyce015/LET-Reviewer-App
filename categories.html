<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - LET Reviewer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/categories.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body>

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px;">📖</div>
                <span style="font-weight: 800; font-size: 20px; color: var(--text-main);">LETReviewer</span>
            </div>

            <nav style="display: flex; flex-direction: column; gap: 8px;">
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item active"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>

        <a href="index.html" id="logoutBtn" class="menu-item" style="color: #EF4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="categories-page" style="padding: 0;">
            <div class="categories-header">
                <div>
                    <h1 class="categories-title">Categories Management</h1>
                    <p class="categories-subtitle">Organize your questions into distinct subjects to help students focus their review.</p>
                </div>
                <div class="category-actions">
                    <a href="bulk-upload.html" style="text-decoration: none;">
                        <button class="bulk-btn"><i class="fa-solid fa-file-csv"></i> Bulk Upload CSV</button>
                    </a>
                    <button class="add-question-btn"><i class="fa-solid fa-plus"></i> New Category</button>
                </div>
            </div>

            <div class="category-grid" id="categoryContainer">
                <div style="padding: 20px;">Loading categories...</div>
                
                <div class="add-category-card" onclick="window.location.href='bulk-upload.html'">
                    <div class="add-icon"><i class="fa-solid fa-plus"></i></div>
                    <h3>Add Data</h3>
                    <p>Upload a new CSV to populate categories.</p>
                </div>
            </div>
        </div>
    </main>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - LET Reviewer</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="assets/js/users.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body>

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px;">📖</div>
                <span style="font-weight: 800; font-size: 20px; color: var(--text-main);">LETReviewer</span>
            </div>

            <nav style="display: flex; flex-direction: column; gap: 8px;">
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item active"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>

        <a href="index.html" id="logoutBtn" class="menu-item" style="color: #EF4444;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="users-page" style="padding: 0;">
            
            <div class="users-header-card">
                <div class="users-header-left">
                    <h1>Users</h1>
                    <p>Manage all registered students and teachers.</p>
                </div>
                <div class="total-users-badge">
                    <i class="fa-solid fa-user-group"></i> Total Users: 142
                </div>
            </div>

            <div class="user-list" id="usersContainer">
        <div style="padding: 20px; text-align: center; font-weight: 700;">Loading user database...</div>
    </div>

            </div>
        </div>
    </main>

</div>

<div id="logoutModal" class="modal-overlay" style="display: none;">
        <div class="modal-content neo-brutal-modal">
            <div class="modal-header" style="background: #FDE68A;"> 
                <h3><i class="fa-solid fa-right-from-bracket"></i> Confirm Logout</h3>
            </div>
            <div class="modal-body">
                <p>Are you sure you want to log out of the admin panel? You will need to sign in again to access your dashboard.</p>
            </div>
            <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="neo-button" id="cancelLogoutBtn" style="background: #E5E7EB; color: #111827; width: auto; padding: 10px 20px;">Cancel</button>
                <button class="neo-button" id="confirmLogoutBtn" style="background: #EF4444; color: #FFFFFF; width: auto; padding: 10px 20px;">Log Out</button>
            </div>
        </div>
    </div>

</body>
</html>

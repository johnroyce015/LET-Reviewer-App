<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions - LET Reviewer</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/questions.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body>

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 2px 2px 0px #111827;">📖</div>
                <span style="font-weight: 900; font-size: 22px; color: #111827; letter-spacing: -0.5px;">LETReviewer</span>
            </div>

            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>

        <a href="#" id="logoutBtn" class="menu-item" style="color: #EF4444; font-weight: 700;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="questions-page" style="padding: 0;">
            
            <div class="questions-header">
                <div>
                    <h1 class="questions-title">Questions</h1>
                    <p class="questions-subtitle">Manage and review all your LET mock exam questions here.</p>
                </div>
                <button class="add-question-btn" onclick="window.location.href='add_question.html'">
                    <i class="fa-solid fa-plus"></i> Add Question
                </button>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" class="search-input" placeholder="Search for a question...">
                </div>
                <select class="filter-select">
                    <option>All Categories</option>
                    <option>General Education</option>
                    <option>Professional Education</option>
                </select>
            </div>

            <div class="question-table-header">
                <div>Question Details</div>
                <div>Subject</div>
                <div>Difficulty</div>
                <div>Status</div>
                <div>Actions</div>
            </div>

            <div id="questionsContainer">
                <div style="padding: 20px; text-align: center;">Loading questions...</div>
            </div>

        </div>
    </main>

</div>

</body>
</html>

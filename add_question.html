<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Admin - Add LET Question</title>
    
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js" defer></script>
    <script src="assets/js/script.js" defer></script>
    <script src="assets/js/modals.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body>

<div class="dashboard-layout">
    
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div style="width: 42px; height: 42px; background: #FDE68A; border: 2px solid #111827; border-radius: 10px; display: flex; justify-content: center; align-items: center; font-size: 20px; box-shadow: 2px 2px 0px #111827;">📖</div>
                <span style="font-weight: 900; font-size: 22px; color: #111827; letter-spacing: -0.5px;">LETReviewer</span>
            </div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item active"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Users</a>
            </nav>
        </div>
        <a href="#" id="logoutBtn" class="menu-item" style="color: #EF4444; font-weight: 700;"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div style="max-width: 800px; margin: 0 auto;">
            
            <div style="margin-bottom: 20px;">
                <a href="questions.html" style="color: #7c3aed; font-weight: bold; text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Questions</a>
            </div>

            <div class="neo-card" style="max-width: 100%;">
                
                <div class="neo-header" style="margin-bottom: 30px;">
                    <div class="neo-icon" style="background: #C4B5FD;"><i class="fa-solid fa-plus"></i></div>
                    <div class="neo-header-text">
                        <h1 style="font-size: 28px; margin-bottom: 5px;">Create New Question</h1>
                        <p style="margin: 0;">Add a new item to the mock exam databank.</p>
                    </div>
                </div>

                <form id="questionForm">
                    <div class="neo-form-group">
                        <label class="neo-label" for="category">Subject Category</label>
                        <select id="category" name="category" class="neo-input" required>
                            <option value="General Education">General Education</option>
                            <option value="Professional Education">Professional Education</option>
                            <option value="Major: English">Major: English</option>
                            <option value="Major: Mathematics">Major: Mathematics</option>
                        </select>
                    </div>

                    <div class="neo-form-group">
                        <label class="neo-label" for="question_text">Question Text</label>
                        <textarea id="question_text" name="question_text" class="neo-input" rows="3" required placeholder="Type the question here..."></textarea>
                    </div>

                    <div class="neo-form-group">
                        <label class="neo-label" style="margin-bottom: 15px; font-size: 15px; border-bottom: 2px solid #E5E7EB; padding-bottom: 5px;">Answer Options (Select the correct one)</label>
                        
                        <div style="display: flex; flex-direction: column; gap: 15px;">
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <input type="radio" id="correct_a" name="correct_answer" value="A" required style="width: 20px; height: 20px; cursor: pointer;" />
                                <label for="correct_a" style="font-weight: 800; font-size: 18px;">A.</label>
                                <input type="text" name="option_a" class="neo-input" required placeholder="Option A text..." />
                            </div>
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <input type="radio" id="correct_b" name="correct_answer" value="B" style="width: 20px; height: 20px; cursor: pointer;" />
                                <label for="correct_b" style="font-weight: 800; font-size: 18px;">B.</label>
                                <input type="text" name="option_b" class="neo-input" required placeholder="Option B text..." />
                            </div>
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <input type="radio" id="correct_c" name="correct_answer" value="C" style="width: 20px; height: 20px; cursor: pointer;" />
                                <label for="correct_c" style="font-weight: 800; font-size: 18px;">C.</label>
                                <input type="text" name="option_c" class="neo-input" required placeholder="Option C text..." />
                            </div>
                            <div style="display: flex; gap: 15px; align-items: center;">
                                <input type="radio" id="correct_d" name="correct_answer" value="D" style="width: 20px; height: 20px; cursor: pointer;" />
                                <label for="correct_d" style="font-weight: 800; font-size: 18px;">D.</label>
                                <input type="text" name="option_d" class="neo-input" required placeholder="Option D text..." />
                            </div>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="neo-button" style="background: #10B981; color: #FFFFFF; font-size: 18px; margin-top: 20px;">
                        <i class="fa-solid fa-cloud-arrow-up"></i> Save Question to Cloud
                    </button>
                    <div id="statusMessage" style="margin-top: 15px; text-align: center; font-weight: bold; font-size: 16px;"></div>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>

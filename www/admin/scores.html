<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Scores - LET Reviewer</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
    <script src="../assets/js/admin/scores.js" defer></script>
    <script src="../assets/js/logout.js" defer></script>
</head>
<body style="visibility: hidden;">

<div class="dashboard-layout">
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div class="logo-icon">📖</div>
                <span class="logo-text">LETReviewer</span>
            </div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Users</a>
                <a href="activity.html" class="menu-item"><i class="fa-solid fa-clipboard-list"></i> Activity Log</a>
                <a href="scores.html" class="menu-item active"><i class="fa-solid fa-chart-simple"></i> Scores</a>
            </nav>
        </div>
        <a href="#" id="logoutBtn" class="menu-item btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="questions-page">
            
            <div class="questions-header">
                <div>
                    <h1 class="questions-title">Student Scores</h1>
                    <p class="questions-subtitle">Track synced exam results and student mastery.</p>
                </div>
                <button class="add-question-btn" id="refreshScoresBtn">
                    <i class="fa-solid fa-arrows-rotate"></i> Refresh
                </button>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchScoreInput" class="search-input" placeholder="Search by student name...">
                </div>
                <select id="scoreCategoryFilter" class="filter-select">
                    <option value="All">All Subjects</option>
                </select>
            </div>

            <div class="user-table-grid">
                <div>Date Sync</div>
                <div>Student Name</div>
                <div>Subject Area</div>
                <div>Raw Score</div>
                <div>Mastery</div>
            </div>

            <div id="scoresContainer">
                <div class="loading-state">Loading scores...</div>
            </div>

        </div>
    </main>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questions - LET Reviewer</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js" defer></script>
    <script src="assets/js/questions.js" defer></script>
    <script src="assets/js/modals.js" defer></script>
    <script src="assets/js/logout.js" defer></script>
</head>
<body style="visibility: hidden;">

<div class="dashboard-layout">
    <aside class="sidebar">
        <div>
            <div class="sidebar-logo">
                <div class="logo-icon">📖</div>
                <span class="logo-text">LETReviewer</span>
            </div>
            <nav>
                <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-table-cells-large"></i> Overview</a>
                <a href="questions.html" class="menu-item active"><i class="fa-solid fa-circle-question"></i> Questions</a>
                <a href="categories.html" class="menu-item"><i class="fa-solid fa-layer-group"></i> Categories</a>
                <a href="users.html" class="menu-item"><i class="fa-solid fa-users"></i> Users</a>
                <a href="activity.html" class="menu-item"><i class="fa-solid fa-clipboard-list"></i> Activity Log</a>
        </div>
        <a href="#" id="logoutBtn" class="menu-item btn-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <main class="dashboard-main">
        <div class="questions-page" style="padding: 0;">
            
            <div class="questions-header">
                <div>
                    <h1 class="questions-title">Questions</h1>
                    <p class="questions-subtitle">Manage and review all your LET mock exam questions here.</p>
                </div>
                <button class="add-question-btn" onclick="window.location.href='add_question.html'">
                    <i class="fa-solid fa-plus"></i> Add Question
                </button>
            </div>

            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search for a question...">
                </div>
                <select id="categoryFilter" class="filter-select">
                    <option value="All">All Categories</option>
                </select>
            </div>

            <div class="question-table-header">
                <div>Question Details</div>
                <div>Subject</div>
                <div>Actions</div>
            </div>

            <div id="questionsContainer">
                <div class="loading-state">Loading questions...</div>
            </div>

        </div>
    </main>
</div>

<div id="editQuestionModal" class="modal-overlay hidden">
    <div class="modal-content neo-brutal-modal" style="max-width: 500px;">
        <div class="modal-header" style="background: #C4B5FD;">
            <h3><i class="fa-solid fa-pen"></i> Edit Question</h3>
        </div>
        <form id="editQuestionForm">
            <input type="hidden" id="editQId">
            <div class="modal-body form-stack">
                <div class="neo-form-group">
                    <label class="neo-label">Question Text</label>
                    <textarea id="editQText" class="neo-input" rows="3" required></textarea>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <div class="neo-form-group">
                        <label class="neo-label">Option A</label>
                        <input type="text" id="editOptA" class="neo-input" required>
                    </div>
                    <div class="neo-form-group">
                        <label class="neo-label">Option B</label>
                        <input type="text" id="editOptB" class="neo-input" required>
                    </div>
                    <div class="neo-form-group">
                        <label class="neo-label">Option C</label>
                        <input type="text" id="editOptC" class="neo-input" required>
                    </div>
                    <div class="neo-form-group">
                        <label class="neo-label">Option D</label>
                        <input type="text" id="editOptD" class="neo-input" required>
                    </div>
                </div>

                <div class="neo-form-group" style="margin-top: 10px;">
                    <label class="neo-label">Correct Answer</label>
                    <select id="editQCorrect" class="neo-input">
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="cancelEditQBtn">Cancel</button>
                <button type="submit" class="btn-confirm">Save Changes</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>

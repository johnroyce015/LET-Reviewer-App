<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home - LET Reviewer</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js" defer></script>
    <script src="../assets/js/script.js" defer></script>
    <script src="../assets/js/admin/modals.js" defer></script>
    <script src="../assets/js/student/dashboard.js" defer></script>
    <script src="../assets/js/student/navigation.js" defer></script>
</head>
<body class="bg-slate hidden-body">

<div class="mobile-app-container">

    <header class="app-topbar">
        <div class="user-avatar clickable" id="openProfileSidebar" title="Profile Menu">
            <i class="fa-solid fa-user"></i>
        </div>
        <div class="brand-name">LETReviewer</div>
        <div class="notification-bell">
            <i class="fa-regular fa-bell"></i>
        </div>
    </header>

    <main class="app-content">
        
        <div class="welcome-section" style="padding: 0 16px; margin-bottom: 20px;">
            <div>
                <p class="welcome-greeting" style="margin-bottom: 4px;">Hello, <span id="studentFirstName">Student</span></p>
                <h2 class="welcome-title" style="margin: 0; line-height: 1.3;">Ready to crush your LET<br>goals today?</h2>
            </div>
        </div>

        <div class="neo-card mobile-card white-card readiness-card">
            <h3 class="readiness-title">Overall Readiness</h3>
            <p class="readiness-desc">You're on track! Keep pushing forward.</p>
            
            <div class="readiness-score-container">
                <div class="readiness-score" id="overallReadinessDisplay">0%</div>
                <div class="status-pill" id="readinessStatusPill">No Data</div>
            </div>
            
            <div class="readiness-stats">
                <span>Performance History</span>
                <span id="readinessCountFraction">0 Exams Logged</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="readinessProgressBar" style="width: 0%; background: #6EE7B7;"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding: 0 16px;">
            <h3 style="margin: 0; font-weight: 900;">Subject Areas</h3>
            <a href="#" style="font-size: 14px; font-weight: bold; color: #6B7280; text-decoration: none;">View All ></a>
        </div>

        <div id="quizContainer" class="subject-stack" style="padding: 0 16px;">
            <div class="state-loading" style="margin: 0;">Fetching review modules...</div>
        </div>
    </main>

</div>
</body>
</html>
